<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>我的导航</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233157d5'/%3E%3Cpath d='M30 70 L70 30 M42 30 H70 V58' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #edf0f3;
    --panel: #ffffff;
    --ink: #16202e;
    --muted: #66758a;
    --line: #d9dfe6;
    --accent: #3157d5;
    --accent-soft: #e4eafc;
    --tile-s: 45%;
    --tile-l: 91%;
    --tile-text-s: 55%;
    --tile-text-l: 32%;
    --radius: 10px;
    --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121821;
      --panel: #1a2230;
      --ink: #e6ebf2;
      --muted: #8d9bb0;
      --line: #2b3648;
      --accent: #7c9bff;
      --accent-soft: #232f52;
      --tile-s: 30%;
      --tile-l: 24%;
      --tile-text-s: 65%;
      --tile-text-l: 82%;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121821;
    --panel: #1a2230;
    --ink: #e6ebf2;
    --muted: #8d9bb0;
    --line: #2b3648;
    --accent: #7c9bff;
    --accent-soft: #232f52;
    --tile-s: 30%;
    --tile-l: 24%;
    --tile-text-s: 65%;
    --tile-text-l: 82%;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 24px; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.55;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .wrap { width: min(1180px, 92%); margin: 0 auto; }

  /* ---------- 顶部：时间 + 搜索 ---------- */
  .top { padding: 28px 0 8px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: .95rem; }
  .top-actions { display: flex; gap: 8px; }
  .chip-btn {
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 14px; color: var(--muted); font-size: .88rem; transition: border-color .15s, color .15s;
  }
  .chip-btn:hover, .chip-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  .clock {
    margin-top: 18px;
    font-size: clamp(3.6rem, 10vw, 7rem);
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .date { margin-top: 10px; color: var(--muted); font-size: 1.05rem; }

  .search { margin-top: 28px; max-width: 760px; }
  .engines { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
  .engine {
    background: transparent; border: 0; padding: 4px 12px; border-radius: 999px;
    color: var(--muted); font-size: .92rem; transition: background .15s, color .15s;
  }
  .engine:hover { color: var(--ink); }
  .engine[aria-checked="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .search-box {
    display: flex; align-items: center; background: var(--panel);
    border: 1.5px solid var(--line); border-radius: 14px; padding: 0 6px 0 18px;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .search-box input {
    flex: 1; border: 0; background: transparent; outline: 0; padding: 15px 0; font-size: 1.1rem; min-width: 0;
  }
  .search-box input::placeholder { color: var(--muted); }
  .go {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 9px 20px; font-weight: 600;
  }
  html[data-theme="dark"] .go { color: #0e1422; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .go { color: #0e1422; } }
  .hint { margin-top: 8px; color: var(--muted); font-size: .85rem; min-height: 1.3em; }
  kbd {
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
    padding: 0 5px; font-size: .8em; font-family: inherit; background: var(--panel);
  }

  /* ---------- 主体：侧栏 + 链接 ---------- */
  .layout { display: grid; grid-template-columns: 180px 1fr; gap: 40px; padding: 36px 0 60px; align-items: start; }
  .side { position: sticky; top: 24px; }
  .side ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .side a {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 12px; border-radius: 8px; color: var(--muted); font-size: .98rem;
    border-left: 3px solid transparent; transition: background .15s, color .15s;
  }
  .side a:hover { color: var(--ink); background: var(--panel); }
  .side a.active { color: var(--accent); border-left-color: var(--accent); background: var(--panel); font-weight: 600; }
  .side .n { font-size: .8rem; opacity: .7; font-variant-numeric: tabular-nums; }

  .cat { margin-bottom: 40px; }
  .cat[hidden] { display: none; }
  .cat h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: baseline; gap: 10px; }
  .cat h2 small { color: var(--muted); font-weight: 400; font-size: .85rem; }

  .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .link {
    position: relative; display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; min-width: 0; transition: border-color .15s, transform .15s;
  }
  .link:hover { border-color: var(--accent); }
  .link[hidden] { display: none; }
  .tile {
    flex: none; width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center;
    font-weight: 700; font-size: 1.05rem;
    background: hsl(var(--h) var(--tile-s) var(--tile-l));
    color: hsl(var(--h) var(--tile-text-s) var(--tile-text-l));
  }
  .meta { min-width: 0; }
  .meta b { display: block; font-weight: 600; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta span { display: block; color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .del {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
    border: 0; background: var(--line); color: var(--ink); font-size: .9rem; line-height: 1; display: none;
  }
  .del:hover { background: #d64545; color: #fff; }
  body.editing .link.custom .del { display: block; }
  .link.custom::after {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
  }

  .empty { display: none; padding: 40px 0; color: var(--muted); }
  .empty.show { display: block; }

  /* ---------- 添加面板 ---------- */
  .editor {
    display: none; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin-bottom: 36px;
  }
  body.editing .editor { display: block; }
  .editor h3 { font-size: 1rem; margin-bottom: 4px; }
  .editor p { color: var(--muted); font-size: .85rem; margin-bottom: 14px; }
  .fields { display: grid; grid-template-columns: 1fr 1.6fr 1fr auto; gap: 10px; }
  .fields input, .fields select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-width: 0; width: 100%;
  }
  .fields input:focus, .fields select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .fields .add { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 0 20px; font-weight: 600; }
  html[data-theme="dark"] .fields .add { color: #0e1422; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fields .add { color: #0e1422; } }
  .err { color: #d64545; font-size: .85rem; margin-top: 8px; min-height: 1.2em; }

  footer { border-top: 1px solid var(--line); padding: 20px 0 32px; color: var(--muted); font-size: .85rem; }

  /* ---------- 小屏 ---------- */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; gap: 20px; padding-top: 24px; }
    .side {
      position: sticky; top: 0; z-index: 10; background: var(--bg); margin: 0 -4vw; padding: 8px 4vw;
      border-bottom: 1px solid var(--line); overflow-x: auto;
    }
    .side ul { flex-direction: row; gap: 6px; }
    .side a { white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; border-radius: 6px; }
    .side a.active { border-bottom-color: var(--accent); }
    .side .n { display: none; }
    .fields { grid-template-columns: 1fr; }
    .fields .add { padding: 10px; }
    html { scroll-padding-top: 64px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-bar">
      <span id="greeting">你好</span>
      <div class="top-actions">
        <button class="chip-btn" id="editBtn" aria-pressed="false">编辑</button>
        <button class="chip-btn" id="themeBtn">切换主题</button>
      </div>
    </div>
    <div class="clock" id="clock" aria-live="off">--:--</div>
    <div class="date" id="date"></div>

    <form class="search" id="searchForm" autocomplete="off">
      <div class="engines" role="radiogroup" aria-label="搜索引擎" id="engines"></div>
      <div class="search-box">
        <input id="q" type="text" placeholder="输入关键词，筛选下方链接，或回车搜索全网" aria-label="搜索">
        <button class="go" type="submit">搜索</button>
      </div>
      <div class="hint" id="hint">按 <kbd>/</kbd> 快速开始输入</div>
    </form>
  </div>
</header>

<main class="wrap layout">
  <aside class="side"><ul id="toc"></ul></aside>
  <div>
    <section class="editor" aria-label="添加链接">
      <h3>添加自己的链接</h3>
      <p>保存在这台设备的浏览器里，不会修改网页文件。想永久保留，请直接编辑 index.html 顶部的 DATA。</p>
      <div class="fields">
        <input id="fName" type="text" placeholder="名称，例如 公司后台" maxlength="20">
        <input id="fUrl" type="text" placeholder="网址，例如 example.com">
        <select id="fCat" aria-label="分类"></select>
        <button type="button" class="add" id="addBtn">添加</button>
      </div>
      <div class="err" id="err" role="alert"></div>
    </section>

    <div id="content"></div>
    <div class="empty" id="empty">没有匹配的链接。按回车，用当前搜索引擎搜索全网。</div>
  </div>
</main>

<footer>
  <div class="wrap">我的导航 · 用 index.html 一个文件部署，改完提交到 GitHub 即可更新。</div>
</footer>

<script>
/* =========================================================
   在这里改你的链接：分类名 + 链接列表 { n: 名称, u: 网址 }
   ========================================================= */
const DATA = [
  { name: "常用", links: [
    { n: "Google", u: "https://www.google.com" },
    { n: "百度", u: "https://www.baidu.com" },
    { n: "Bing", u: "https://www.bing.com" },
    { n: "Gmail", u: "https://mail.google.com" },
    { n: "Google 翻译", u: "https://translate.google.com" },
    { n: "维基百科", u: "https://zh.wikipedia.org" }
  ]},
  { name: "AI 助手", links: [
    { n: "Claude", u: "https://claude.ai" },
    { n: "ChatGPT", u: "https://chatgpt.com" },
    { n: "Gemini", u: "https://gemini.google.com" },
    { n: "DeepSeek", u: "https://chat.deepseek.com" },
    { n: "Kimi", u: "https://www.kimi.com" },
    { n: "通义千问", u: "https://tongyi.aliyun.com" }
  ]},
  { name: "开发", links: [
    { n: "GitHub", u: "https://github.com" },
    { n: "我的 GitHub", u: "https://github.com/shenc9108-hash" },
    { n: "Stack Overflow", u: "https://stackoverflow.com" },
    { n: "MDN 文档", u: "https://developer.mozilla.org/zh-CN/" },
    { n: "npm", u: "https://www.npmjs.com" },
    { n: "Cloudflare", u: "https://dash.cloudflare.com" },
    { n: "Vercel", u: "https://vercel.com" },
    { n: "掘金", u: "https://juejin.cn" }
  ]},
  { name: "社区与视频", links: [
    { n: "YouTube", u: "https://www.youtube.com" },
    { n: "哔哩哔哩", u: "https://www.bilibili.com" },
    { n: "知乎", u: "https://www.zhihu.com" },
    { n: "V2EX", u: "https://www.v2ex.com" },
    { n: "Reddit", u: "https://www.reddit.com" },
    { n: "X", u: "https://x.com" }
  ]},
  { name: "效率工具", links: [
    { n: "Notion", u: "https://www.notion.so" },
    { n: "Canva", u: "https://www.canva.com" },
    { n: "TinyPNG", u: "https://tinypng.com" },
    { n: "ProcessOn", u: "https://www.processon.com" },
    { n: "Excalidraw", u: "https://excalidraw.com" },
    { n: "IT 工具箱", u: "https://it-tools.tech" }
  ]},
  { name: "生活", links: [
    { n: "淘宝", u: "https://www.taobao.com" },
    { n: "京东", u: "https://www.jd.com" },
    { n: "高德地图", u: "https://www.amap.com" },
    { n: "12306", u: "https://www.12306.cn" },
    { n: "网易云音乐", u: "https://music.163.com" },
    { n: "豆瓣", u: "https://www.douban.com" }
  ]}
];

const ENGINES = [
  { name: "Google", url: "https://www.google.com/search?q=" },
  { name: "百度",   url: "https://www.baidu.com/s?wd=" },
  { name: "Bing",   url: "https://www.bing.com/search?q=" },
  { name: "GitHub", url: "https://github.com/search?q=" }
];

/* ---------------- 工具函数 ---------------- */
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 存储不可用时忽略 */ } }
};
const hueOf = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) % 360; return h; };
const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

let custom = store.get("nav.custom", []);   // [{cat, n, u}]
let engineIdx = Math.min(store.get("nav.engine", 0), ENGINES.length - 1);

/* ---------------- 时间与问候 ---------------- */
function tick() {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
  $("date").textContent = d.toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
  const h = d.getHours();
  $("greeting").textContent = h < 6 ? "夜深了，早点休息" : h < 12 ? "早上好" : h < 14 ? "中午好" : h < 18 ? "下午好" : "晚上好";
}
tick(); setInterval(tick, 10000);

/* ---------------- 渲染链接 ---------------- */
function makeLink(item, isCustom, idx) {
  const a = el("a", "link" + (isCustom ? " custom" : ""));
  a.href = item.u; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.dataset.key = (item.n + " " + hostOf(item.u)).toLowerCase();
  const tile = el("div", "tile", Array.from(item.n.trim())[0] || "?");
  tile.style.setProperty("--h", hueOf(item.n));
  const meta = el("div", "meta");
  meta.append(el("b", null, item.n), el("span", null, hostOf(item.u)));
  a.append(tile, meta);
  if (isCustom) {
    const del = el("button", "del", "×");
    del.type = "button"; del.title = "删除"; del.setAttribute("aria-label", "删除 " + item.n);
    del.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      custom.splice(idx, 1); store.set("nav.custom", custom); render();
    });
    a.append(del);
  }
  return a;
}

function render() {
  const content = $("content"), toc = $("toc"), sel = $("fCat");
  content.replaceChildren(); toc.replaceChildren();
  const prevCat = sel.value; sel.replaceChildren();

  const cats = DATA.map(c => ({ name: c.name, links: c.links.map(l => ({ item: l, custom: false })) }));
  custom.forEach((c, i) => {
    let cat = cats.find(x => x.name === c.cat);
    if (!cat) { cat = { name: c.cat, links: [] }; cats.push(cat); }
    cat.links.push({ item: c, custom: true, idx: i });
  });

  cats.forEach((cat, i) => {
    const id = "cat-" + i;
    const sec = el("section", "cat"); sec.id = id;
    const h = el("h2", null, cat.name); h.append(el("small", null, cat.links.length + " 个"));
    const grid = el("div", "links");
    cat.links.forEach(l => grid.append(makeLink(l.item, l.custom, l.idx)));
    sec.append(h, grid); content.append(sec);

    const li = el("li"); const a = el("a"); a.href = "#" + id;
    a.append(el("span", null, cat.name), el("span", "n", String(cat.links.length)));
    li.append(a); toc.append(li);

    const opt = el("option", null, cat.name); opt.value = cat.name; sel.append(opt);
  });
  if ([...sel.options].some(o => o.value === prevCat)) sel.value = prevCat;
  filter();
  observe();
}

/* ---------------- 搜索：筛选 + 全网搜索 ---------------- */
function filter() {
  const q = $("q").value.trim().toLowerCase();
  let total = 0;
  document.querySelectorAll(".cat").forEach(sec => {
    let shown = 0;
    sec.querySelectorAll(".link").forEach(l => {
      const ok = !q || l.dataset.key.includes(q);
      l.hidden = !ok; if (ok) shown++;
    });
    sec.hidden = shown === 0; total += shown;
  });
  $("empty").classList.toggle("show", total === 0);
  $("hint").innerHTML = q
    ? "匹配 " + total + " 个链接，按回车用 " + ENGINES[engineIdx].name + " 搜索全网"
    : "按 <kbd>/</kbd> 快速开始输入";
}

function renderEngines() {
  const box = $("engines"); box.replaceChildren();
  ENGINES.forEach((e, i) => {
    const b = el("button", "engine", e.name);
    b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", String(i === engineIdx));
    b.addEventListener("click", () => { engineIdx = i; store.set("nav.engine", i); renderEngines(); filter(); $("q").focus(); });
    box.append(b);
  });
}

$("q").addEventListener("input", filter);
$("searchForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  window.open(ENGINES[engineIdx].url + encodeURIComponent(q), "_blank", "noopener");
});
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("q")) { $("q").value = ""; filter(); $("q").blur(); }
});

/* ---------------- 侧栏高亮 ---------------- */
let io;
function observe() {
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        document.querySelectorAll("#toc a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id));
      }
    });
  }, { rootMargin: "-20% 0px -70% 0px" });
  document.querySelectorAll(".cat").forEach(s => io.observe(s));
}

/* ---------------- 添加 / 编辑 ---------------- */
$("editBtn").addEventListener("click", () => {
  const on = document.body.classList.toggle("editing");
  $("editBtn").setAttribute("aria-pressed", String(on));
  $("editBtn").textContent = on ? "完成" : "编辑";
});
$("addBtn").addEventListener("click", () => {
  const n = $("fName").value.trim();
  let u = $("fUrl").value.trim();
  const err = $("err"); err.textContent = "";
  if (!n || !u) { err.textContent = "请填写名称和网址。"; return; }
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try { const p = new URL(u); if (!/^https?:$/.test(p.protocol) || !p.hostname.includes(".")) throw 0; }
  catch (e) { err.textContent = "网址格式不正确，例如 example.com。"; return; }
  custom.push({ cat: $("fCat").value, n, u });
  store.set("nav.custom", custom);
  $("fName").value = ""; $("fUrl").value = "";
  render();
});
["fName", "fUrl"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") $("addBtn").click(); }));

/* ---------------- 主题 ---------------- */
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; }
applyTheme(store.get("nav.theme", null));
$("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next); store.set("nav.theme", next);
});

renderEngines();
render();
</script>
</body>
</html>
